# 전체 실행: ./gradlew bootJar && docker compose -f infra/docker-compose.yml up -d --build
name: ad-commerce-lab

x-spring: &spring
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
  SPRING_DATASOURCE_USERNAME: lab
  SPRING_DATASOURCE_PASSWORD: lab

# 관측(ADR-0005): 트레이스는 Jaeger로, 메트릭은 Prometheus가 긁어 간다.
x-observability: &observability
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
  MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,prometheus,circuitbreakers,circuitbreakerevents
  MANAGEMENT_METRICS_DISTRIBUTION_PERCENTILESHISTOGRAM_HTTP_SERVER_REQUESTS: "true"
  SPRING_KAFKA_TEMPLATE_OBSERVATIONENABLED: "true"
  SPRING_KAFKA_LISTENER_OBSERVATIONENABLED: "true"
  SERVER_TOMCAT_MBEANREGISTRY_ENABLED: "true" # 요청 스레드 사용량(tomcat_threads_busy) 메트릭

services:
  postgres:
    image: postgres:17.12-alpine
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: lab
    ports: ["5432:5432"]
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab"]
      interval: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.3.2
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1"]
      interval: 5s
      retries: 30

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.1
    ports: ["8089:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      kafka: { condition: service_healthy }

  catalog:
    build: { context: .., dockerfile: infra/service.Dockerfile, args: { SERVICE: catalog } }
    restart: unless-stopped
    ports: ["8081:8081"]
    environment:
      <<: [*spring, *observability]
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/catalog
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }

  campaign:
    build: { context: .., dockerfile: infra/service.Dockerfile, args: { SERVICE: campaign } }
    restart: unless-stopped
    ports: ["8082:8082"]
    environment:
      <<: [*spring, *observability]
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/campaign
      CLIENTS_CATALOG_URL: http://toxiproxy:28081 # 장애 주입을 위해 Toxiproxy를 거친다
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      toxiproxy: { condition: service_started }

  payment:
    build: { context: .., dockerfile: infra/service.Dockerfile, args: { SERVICE: payment } }
    restart: unless-stopped
    ports: ["8083:8083"]
    environment:
      <<: [*spring, *observability]
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payment
      CLIENTS_PG_URL: http://toxiproxy:28090 # 장애 주입을 위해 Toxiproxy를 거친다
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      toxiproxy: { condition: service_started }

  mock-pg:
    build: { context: .., dockerfile: infra/service.Dockerfile, args: { SERVICE: mock-pg } }
    restart: unless-stopped
    ports: ["18090:8090"] # 호스트 8090은 Windows가 쓰는 경우가 있어 피한다
    environment:
      <<: *observability

  gateway:
    build: { context: .., dockerfile: infra/service.Dockerfile, args: { SERVICE: gateway } }
    restart: unless-stopped
    ports: ["8080:8080"]
    environment:
      <<: *observability
      CATALOG_URL: http://catalog:8081
      CAMPAIGN_URL: http://campaign:8082
      PAYMENT_URL: http://payment:8083

  # 장애 주입(M2): 서비스 사이 링크에 지연·끊김을 건다. 제어 API는 localhost:8474.
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.13.0
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    ports: ["127.0.0.1:8474:8474"]
    volumes: ["./toxiproxy:/config:ro"]

  jaeger:
    image: jaegertracing/jaeger:2.23.0
    ports: ["127.0.0.1:16686:16686"] # UI. OTLP(4318)는 컨테이너 사이에서만 쓴다

  prometheus:
    image: prom/prometheus:v3.16.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d"]
    ports: ["127.0.0.1:9090:9090"]
    volumes: ["./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]

  grafana:
    image: grafana/grafana:13.3.1
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true" # 로컬 전용. 보기 권한만 준다
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/m2-resilience.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  pgdata:

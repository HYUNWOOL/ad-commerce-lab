# 실험용 덮어쓰기: 서킷이 열리지 않고(임계값 100%, 느린 호출 기준 60초) catalog 타임아웃이 30초인 "보호 없음" 상태.
# 사용: docker compose -f infra/docker-compose.yml -f infra/experiments/no-protection.yml up -d campaign payment
services:
  payment:
    environment:
      RESILIENCE4J_CIRCUITBREAKER_CONFIGS_DEFAULT_FAILURERATETHRESHOLD: "100"
      RESILIENCE4J_CIRCUITBREAKER_CONFIGS_DEFAULT_SLOWCALLRATETHRESHOLD: "100"
      RESILIENCE4J_CIRCUITBREAKER_CONFIGS_DEFAULT_SLOWCALLDURATIONTHRESHOLD: 60s
  campaign:
    environment:
      RESILIENCE4J_CIRCUITBREAKER_INSTANCES_CATALOG_FAILURERATETHRESHOLD: "100"
      RESILIENCE4J_CIRCUITBREAKER_INSTANCES_CATALOG_SLOWCALLRATETHRESHOLD: "100"
      RESILIENCE4J_CIRCUITBREAKER_INSTANCES_CATALOG_SLOWCALLDURATIONTHRESHOLD: 60s
      CLIENTS_CATALOG_READTIMEOUT: 30s

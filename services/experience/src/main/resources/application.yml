server:
  port: 8086
spring:
  application:
    name: experience
  threads:
    virtual:
      enabled: true # 출처를 병렬로 부를 때 요청 스레드를 붙잡아도 부담이 적다
  datasource:
    url: jdbc:postgresql://localhost:5432/experience
    username: lab
    password: lab
  flyway:
    locations: classpath:db/common,classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092
clients:
  catalog: { url: "http://localhost:8081" }
  delivery: { url: "http://localhost:8084" }
  settlement: { url: "http://localhost:8085" }
  agent: { url: "http://localhost:8000" }
  read-timeout: 1s # 출처 하나의 응답 타임아웃(ADR-0003 조회 1초)
experience:
  screen-deadline: 1500ms # 화면 하나를 만드는 데 기다리는 최대 시간. 넘으면 그 영역만 대체 표시
# 출처(하위 서비스)마다 서킷을 둔다(ADR-0009 3번).
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-duration-threshold: 1s
        slow-call-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers

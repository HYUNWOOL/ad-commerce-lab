server:
  port: 8080
spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: catalog
              uri: ${CATALOG_URL:http://localhost:8081}
              predicates:
                - Path=/api/catalog/**
              filters:
                - StripPrefix=2
            # /api/campaigns 보다 먼저 둔다. 집행 통계의 원본은 delivery다(ADR-0007).
            - id: campaign-stats
              uri: ${DELIVERY_URL:http://localhost:8084}
              predicates:
                - Path=/api/campaigns/*/stats
              filters:
                - StripPrefix=1
            - id: settlements
              uri: ${SETTLEMENT_URL:http://localhost:8085}
              predicates:
                - Path=/api/settlements/**
              filters:
                - StripPrefix=1
            # 에이전트(ADR-0010): MCP 도구와 위임·승인·감사 REST. /api/admin/agent는 screens(/api/admin/**)보다 먼저 둔다.
            - id: agent-ops
              uri: ${AGENT_URL:http://localhost:8000}
              predicates:
                - Path=/api/admin/agent/**
              filters:
                - StripPrefix=3
            - id: agent
              uri: ${AGENT_URL:http://localhost:8000}
              predicates:
                - Path=/api/agent/**
              filters:
                - StripPrefix=2
            # 서버 주도 화면(ADR-0009). /api/admin은 운영자 키만 통과한다(ApiKeyFilter).
            - id: screens
              uri: ${EXPERIENCE_URL:http://localhost:8086}
              predicates:
                - Path=/api/screens/**,/api/admin/**
              filters:
                - StripPrefix=1
            - id: orders
              uri: ${CAMPAIGN_URL:http://localhost:8082}
              predicates:
                - Path=/api/orders/**,/api/campaigns/**
              filters:
                - StripPrefix=1
            - id: payments
              uri: ${PAYMENT_URL:http://localhost:8083}
              predicates:
                - Path=/api/payments/**
              filters:
                - StripPrefix=1
# 로컬 실험용 데모 키(실제 비밀값 아님)
gateway:
  api-keys:
    demo-partner-key: P-DEMO
    demo-partner-key-2: P-DEMO-2
  operator-keys:
    demo-operator-key: ops-demo # 로컬 실험용 데모 운영자 키(실제 비밀값 아님)
  agent-keys: # 에이전트 전용 데모 키: MCP 도구 경로만 통과한다(실제 비밀값 아님)
    demo-agent-key: partner:P-DEMO
    demo-ops-agent-key: operator:ops-demo
management:
  endpoints:
    web:
      exposure:
        include: health,info

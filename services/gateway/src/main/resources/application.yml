server:
  port: 8080
spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: catalog
              uri: ${CATALOG_URL:http://localhost:8081}
              predicates:
                - Path=/api/catalog/**
              filters:
                - StripPrefix=2
            - id: orders
              uri: ${CAMPAIGN_URL:http://localhost:8082}
              predicates:
                - Path=/api/orders/**,/api/campaigns/**
              filters:
                - StripPrefix=1
            - id: payments
              uri: ${PAYMENT_URL:http://localhost:8083}
              predicates:
                - Path=/api/payments/**
              filters:
                - StripPrefix=1
# 로컬 실험용 데모 키(실제 비밀값 아님)
gateway:
  api-keys:
    demo-partner-key: P-DEMO
    demo-partner-key-2: P-DEMO-2
management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: 8083
spring:
  application:
    name: payment
  datasource:
    url: jdbc:postgresql://localhost:5432/payment
    username: lab
    password: lab
  flyway:
    locations: classpath:db/common,classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      auto-offset-reset: earliest
    listener:
      concurrency: 3 # campaign.order 파티션 3개를 나눠 받는다
  task:
    scheduling:
      pool:
        size: 2 # 재조회가 PG를 기다리는 동안 Outbox 릴레이가 멈추지 않게(ADR-0004)
clients:
  pg:
    url: http://localhost:8090
    read-timeout: 3s
payment:
  reconcile:
    interval-ms: 5000
    unknown-after: 5s
    requested-after: 15s # 보류(503·서킷 열림)와 처리 중 죽은 결제. PG 읽기 타임아웃 3초보다 충분히 길게
    give-up-after: 10m # 이 안에 PG가 받지 못하면 실패로 확정(ADR-0006)
    batch: 20
  pg-unavailable: defer
# PG 호출 장애 격리(ADR-0003). 느린 호출(2초 이상)도 실패로 센다.
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-duration-threshold: 2s
        slow-call-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
    # 승인(pg)과 조회(pg-query)는 서킷을 나눈다(ADR-0004).
    instances:
      pg: { base-config: default }
      pg-query: { base-config: default }
management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers

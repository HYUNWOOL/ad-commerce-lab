# 정적 파일 + /api는 gateway로. 화면을 새로 그리는 데 앱 배포가 필요 없도록, 화면 구성은 모두 /api/screens에서 온다.
server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://gateway:8080;
        proxy_read_timeout 15s;
    }

    location / {
        try_files $uri /index.html;
    }
}
